<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Share Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 0.92fr;
      align-items: center;
      padding: 52px 48px 52px 56px;
      gap: 8px;
      background: #ffffff;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 60% at 88% 20%, rgba(182, 244, 0, 0.28), transparent 60%),
        #ffffff;
    }
    .left, .right { position: relative; z-index: 2; }
    .left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 36rem;
    }
    .kicker {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #111111;
      margin-bottom: 10px;
    }
    .role {
      font-size: 18px;
      font-weight: 700;
      color: #b6f400;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }
    .role-2 {
      font-size: 16px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 0.92;
      color: #111111;
    }
    h1::after {
      content: "";
      display: block;
      width: 4.4rem;
      height: 3px;
      margin: 16px 0 18px;
      background: #b6f400;
      border-radius: 2px;
    }
    .pitch {
      font-family: "Newsreader", Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1.22;
      max-width: 22ch;
      color: #111111;
    }
    .proof {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 600;
      color: #555555;
      letter-spacing: -0.01em;
    }
    .proof b { color: #111111; font-weight: 700; }
    .url {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #555555;
    }
    .right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }
    .frame {
      position: relative;
      width: 448px;
      height: 448px;
    }
    .frame img {
      width: 448px;
      height: 448px;
      object-fit: cover;
      border-radius: 22px;
      box-shadow:
        0 1px 0 rgba(17, 17, 17, 0.06),
        0 28px 56px rgba(17, 17, 17, 0.18);
    }
    .chip {
      position: absolute;
      right: -10px;
      bottom: 26px;
      background: #111111;
      color: #ffffff;
      border-radius: 14px;
      padding: 12px 16px 10px;
      border-left: 4px solid #b6f400;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      min-width: 158px;
    }
    .chip .n {
      font-family: "Newsreader", Georgia, serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .chip .l {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.58);
      margin-top: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg" aria-hidden="true"></div>
    <div class="left">
      <p class="kicker">javydiaz.com</p>
      <h1>Javier Diaz</h1>
      <p class="role">Founder, SOPITA.GG &amp; BingoBango.ai</p>
      <p class="role-2">Vice President, Global Supply Chain · Cra-Z-Art</p>
      <p class="pitch">He builds the structure that calms the chaos.</p>
      <p class="proof"><b>~$710M</b> working capital returned to the business</p>
      <p class="url">English · Spanish · Portuguese</p>
    </div>
    <div class="right">
      <div class="frame">
        <img src="javier-portrait-hero.png" width="448" height="448" alt="Javier Diaz">
      </div>
    </div>
  </div>
</body>
</html>
