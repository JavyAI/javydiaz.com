<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Share Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #111111; }
    .card {
      width: 1200px; height: 630px; position: relative;
      display: grid; grid-template-columns: 1.08fr 0.92fr;
      align-items: center; padding: 56px 48px 56px 64px; gap: 12px;
      background: #111111; color: #ffffff;
    }
    .bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 50% 70% at 92% 18%, rgba(182,244,0,0.22), transparent 58%),
        #111111;
    }
    .left, .right { position: relative; z-index: 2; }
    .kicker {
      font-family: "Source Sans 3", sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: #b6f400; margin-bottom: 18px;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-size: 78px; font-weight: 500; letter-spacing: -0.035em;
      line-height: 0.9; color: #ffffff;
    }
    h1::after {
      content: ""; display: block; width: 4.6rem; height: 4px;
      margin: 18px 0 20px; background: #b6f400; border-radius: 2px;
    }
    .role {
      font-family: "Source Sans 3", sans-serif;
      font-size: 22px; font-weight: 700; color: #b6f400;
      letter-spacing: -0.015em; margin-bottom: 6px;
    }
    .role-2 {
      font-family: "Source Sans 3", sans-serif;
      font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 18px;
    }
    .pitch {
      font-family: "Newsreader", Georgia, serif;
      font-size: 26px; font-weight: 500; font-style: italic;
      letter-spacing: -0.02em; line-height: 1.25; max-width: 20ch; color: #f2f2f2;
    }
    .url {
      margin-top: 28px;
      font-family: "Source Sans 3", sans-serif;
      font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: rgba(255,255,255,0.62);
    }
    .frame { width: 468px; height: 468px; }
    .frame img {
      width: 468px; height: 468px; object-fit: cover; object-position: 50% 18%;
      border-radius: 22px; border: 4px solid #b6f400;
      box-shadow: 0 28px 56px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg" aria-hidden="true"></div>
    <div class="left">
      <p class="kicker">javydiaz.com</p>
      <h1>Javier Diaz</h1>
      <p class="role">Founder, SOPITA.GG &amp; BingoBango.ai</p>
      <p class="role-2">Vice President, Global Supply Chain · Cra-Z-Art</p>
      <p class="pitch">He builds the structure that calms the chaos.</p>
      <p class="url">Lyndhurst, NJ</p>
    </div>
    <div class="right">
      <div class="frame">
        <img src="javier-portrait-hero.png" width="468" height="468" alt="Javier Diaz">
      </div>
    </div>
  </div>
</body>
</html>
